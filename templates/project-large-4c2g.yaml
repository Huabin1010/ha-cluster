# 项目 large：4 CPU / 2Gi 配额模板（尚未接到集群）
# 用法：kubectl apply -f templates/project-large-4c2g.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: proj-example
  labels:
    ha-cluster.mnnumath.vip/plan: large
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-quota
  namespace: proj-example
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 2Gi
    limits.cpu: "8"
    limits.memory: 2Gi
    pods: "20"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: project-defaults
  namespace: proj-example
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 256Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 2Gi
