openapi: 3.0.3
info:
  title: ha-cluster API
  version: 0.1.0
servers:
  - url: /
paths:
  /healthz:
    get:
      responses:
        "200":
          description: ok
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201": { description: created }
  /auth/login:
    post:
      responses:
        "200": { description: token + refresh_token }
  /auth/refresh:
    post:
      responses:
        "200": { description: rotated tokens }
  /projects:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: created }
  /projects/{id}/workspaces:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: workspace }
        "409": { description: INSUFFICIENT_CAPACITY }
  /admin/reconcile:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: released + stale_nodes }
  /workspaces/{id}/approve:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: provisioned workspace }
        "403": { description: not project admin }
        "409": { description: INSUFFICIENT_CAPACITY }
  /workspaces/{id}/reject:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: rejected }
  /workspaces/{id}/connection:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: bastion ssh command }
        "403": { description: not approved or no ssh }
        "404": { description: not a project member }
  /projects/{id}/members/{uid}:
    put:
      security: [{ bearerAuth: [] }]
      summary: Patch member role / ssh_access / ssh_mode
      responses:
        "200": { description: updated membership }
        "403": { description: not project admin }
        "404": { description: not found }
  /projects/{id}/transfer-ownership:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: transferred }
        "403": { description: not owner }
  /projects/{id}/ssh-access-request:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: ssh_access pending }
  /projects/{id}/members/{uid}/ssh-access/approve:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: ssh_access granted }
  /workspaces/{id}/destroy-request:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: destroy_requested }
        "409": { description: conflict }
  /workspaces/{id}/destroy-request/approve:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: pending platform approval }
  /admin/dangerous-approvals:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: pending dangerous ops }
  /admin/dangerous-approvals/{id}/approve:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: destroyed }
  /admin/join-tokens:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: join token }
  /nodes/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: updated node meta }
        "403": { description: platform staff only }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
