root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ha-api ./cmd/ha-api"
  bin = "./tmp/ha-api"
  entrypoint = "./tmp/ha-api"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "dist", "deploy", "docker", ".git"]
  exclude_regex = ["_test.go"]
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
