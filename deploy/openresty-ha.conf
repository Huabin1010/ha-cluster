# OpenResty — ha.mnnumath.vip（1Panel 路径示例）
# 生效文件：/opt/1panel/apps/openresty/openresty/conf/conf.d/ha.mnnumath.vip.conf
# 静态根在容器内为 /www/ha-web（宿主机：…/openresty/www/ha-web）
# ha-api 因宿主 :8080 已被 DataEase 占用，绑 127.0.0.1:18082

location = /api {
  return 308 /api/;
}

location /api/ {
  proxy_pass http://127.0.0.1:18082/;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
}

location / {
  root /www/ha-web;
  try_files $uri /index.html;
}
