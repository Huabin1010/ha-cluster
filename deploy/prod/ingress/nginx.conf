# ha-cluster apps ingress (listens on 18081; Baota proxies *.apps here)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-route server blocks written by ha-api (HA_INGRESS_DIR).
  include /etc/nginx/ha-ingress/*.conf;

  # Fallback when no route matches — avoid leaking default site.
  server {
    listen 80 default_server;
    server_name _;
    return 404;
  }
}
