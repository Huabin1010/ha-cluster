# Unified edge: Baota proxies ALL public Hosts to this single port (18080).
# Host-based routing only applies to HTTP(S). Native SSH clients do not send
# Host headers — CLI ssh still uses bastion :8099 (or ProxyJump). *.ssh Host
# below only handles browsers / HTTP probes (redirect to console SSH help).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 64m;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream ha_api {
    server ha-api:8080;
  }

  # Console + API
  server {
    listen 80;
    server_name cl.qzsyzn.com;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://ha_api;
    }
  }

  # Apps: per-route blocks written by ha-api into HA_INGRESS_DIR
  include /etc/nginx/ha-ingress/*.conf;

  # *.ssh — HTTP only (browser). Native OpenSSH cannot be Host-routed here.
  server {
    listen 80;
    server_name ~^(?<ws>[a-z0-9]+)\.ssh\.cl\.qzsyzn\.com$;
    location / {
      default_type text/plain;
      return 200 "ha-cluster bastion zone\nUse: ssh -p 8099 <platform-user>@$host -t <workspace-uuid>\nOr open the console Web Terminal (HTTPS on cl.qzsyzn.com).\n";
    }
  }

  server {
    listen 80 default_server;
    server_name _;
    return 404;
  }
}
