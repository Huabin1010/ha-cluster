# Dedicated bastion sshd config (Port 8099).
# Install as /etc/ssh/sshd_config_bastion and run:
#   /usr/sbin/sshd -D -f /etc/ssh/sshd_config_bastion
# Do NOT replace the management sshd on :22.
#
# Install notes:
#   chown root:nogroup /etc/ha-cluster/bastion.env && chmod 640 that file
#   (AuthorizedKeysCommand runs as nobody / nogroup)
#   Append SetEnv HA_API=… and SetEnv HA_INTERNAL_TOKEN=… (from bastion.env)
#   so ForceCommand children receive them. Keep this file mode 600.

Port 8099
ListenAddress 0.0.0.0
ListenAddress ::

HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

AuthorizedKeysCommand /usr/local/bin/ha-auth-keys %u
AuthorizedKeysCommandUser nobody

# Every authenticated session is forced into the proxy — no VPS shell.
ForceCommand /usr/local/bin/ha-bastion-proxy
PermitTTY yes
AllowAgentForwarding yes
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
AcceptEnv LANG LC_*

# Login users are platform usernames (nologin shell + ForceCommand).
UsePAM yes
PrintMotd no
PrintLastLog no
ClientAliveInterval 30
ClientAliveCountMax 3
MaxSessions 5
LoginGraceTime 30

SyslogFacility AUTH
LogLevel VERBOSE

PidFile /run/sshd-bastion.pid
Subsystem sftp /usr/lib/openssh/sftp-server

# SetEnv HA_API=… and SetEnv HA_INTERNAL_TOKEN=… are appended by the
# install step (secrets must not live in the git-tracked template).
