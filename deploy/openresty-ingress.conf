# User-domain vhosts generated by ha-api.
#
# In OpenResty http { } add:
#
#   map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
#   }
#   include /etc/ha-cluster/ingress/*.conf;
#
# ha-api env:
#   HA_INGRESS_DIR=/etc/ha-cluster/ingress
#   HA_INGRESS_RELOAD=/usr/local/openresty/bin/openresty -s reload
#   HA_INGRESS_PUBLIC_HOST=106.52.109.127
#
# Default proxy preset is nocache (no-store, buffering off, timeout 3600s).
# Do NOT put these server blocks inside the ha.mnnumath.vip console vhost.
